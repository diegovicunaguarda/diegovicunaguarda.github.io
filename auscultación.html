<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auscultador Pro - Minimalista</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 450px; margin: 0 auto; text-align: center; }
    .card { background: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    button { background: #2563eb; color: white; border: none; padding: 16px 20px; font-size: 16px; font-weight: bold; border-radius: 12px; margin: 8px 0; cursor: pointer; width: 100%; }
    button:disabled { background: #334155; color: #64748b; }
    
    /* Indicador minimalista de luz LED */
    .status-container { display: flex; justify-content: center; align-items: center; margin: 16px 0 8px 0; }
    .dot { width: 24px; height: 24px; border-radius: 50%; background: #64748b; transition: background-color 0.12s ease, box-shadow 0.12s ease; }
    .dot.active { background: #22c55e; box-shadow: 0 0 14px rgba(34, 197, 94, 0.7); }      /* VERDE */
    .dot.suppressed { background: #ef4444; box-shadow: 0 0 14px rgba(239, 68, 68, 0.7); }  /* ROJO */

    .meter { height: 10px; background: #334155; border-radius: 5px; overflow: hidden; margin-top: 15px; }
    .fill { height: 100%; width: 0%; background: #38bdf8; transition: width 0.05s linear; }
  </style>
</head>
<body>
  <h2>Auscultador Pro</h2>

  <div class="card">
    <button id="btnStart">Iniciar Auscultación</button>
    <button id="btnStop" disabled style="background:#475569;">Detener</button>
    
    <!-- Punto LED de Estado -->
    <div class="status-container">
      <div id="dot" class="dot"></div>
    </div>

    <div class="meter"><div class="fill" id="meterFill"></div></div>
  </div>

  <script>
    let audioCtx = null;
    let mediaStream = null;
    let animFrame = null;
    let hp1, hp2, lp1, lp2, limiter, gainNode, analyser;
    let isMutedForTransient = false;

    const btnStart = document.getElementById('btnStart');
    const btnStop = document.getElementById('btnStop');
    const dot = document.getElementById('dot');
    const meterFill = document.getElementById('meterFill');

    btnStart.onclick = async () => {
      try {
        if (audioCtx) {
          await audioCtx.close();
          audioCtx = null;
        }

        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 0 });

        mediaStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            channelCount: 1
          }
        });

        const source = audioCtx.createMediaStreamSource(mediaStream);

        // Filtro Doble Pasa-Altos (100 Hz) y Doble Pasa-Bajos (1100 Hz)
        hp1 = audioCtx.createBiquadFilter(); hp1.type = 'highpass'; hp1.frequency.value = 100;
        hp2 = audioCtx.createBiquadFilter(); hp2.type = 'highpass'; hp2.frequency.value = 100;
        lp1 = audioCtx.createBiquadFilter(); lp1.type = 'lowpass'; lp1.frequency.value = 1100;
        lp2 = audioCtx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 1100;

        // Limitador de seguridad
        limiter = audioCtx.createDynamicsCompressor();
        limiter.threshold.value = -12;
        limiter.knee.value = 0;
        limiter.ratio.value = 20;
        limiter.attack.value = 0.001;
        limiter.release.value = 0.04;

        gainNode = audioCtx.createGain();
        gainNode.gain.value = 2.8;

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;

        source.connect(hp1);
        hp1.connect(hp2);
        hp2.connect(lp1);
        lp1.connect(lp2);
        lp2.connect(limiter);
        limiter.connect(gainNode);
        gainNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        btnStart.disabled = true;
        btnStop.disabled = false;
        dot.className = "dot active"; // Se pone verde al iniciar

        const pcmData = new Float32Array(analyser.fftSize);

        function processAudio() {
          analyser.getFloatTimeDomainData(pcmData);

          let maxPeak = 0;
          let sumSquares = 0;

          for (let i = 0; i < pcmData.length; i++) {
            let abs = Math.abs(pcmData[i]);
            if (abs > maxPeak) maxPeak = abs;
            sumSquares += abs * abs;
          }

          let rms = Math.sqrt(sumSquares / pcmData.length);
          meterFill.style.width = Math.min(100, rms * 500) + '%';

          // Detección de impacto / despegue brusco
          if (maxPeak > 0.45) {
            gainNode.gain.setTargetAtTime(0.01, audioCtx.currentTime, 0.005);
            dot.className = "dot suppressed"; // ROJO
            isMutedForTransient = true;
          } else if (isMutedForTransient && maxPeak < 0.2) {
            gainNode.gain.setTargetAtTime(2.8, audioCtx.currentTime, 0.08);
            dot.className = "dot active"; // VERDE
            isMutedForTransient = false;
          }

          animFrame = requestAnimationFrame(processAudio);
        }

        processAudio();

      } catch (err) {
        alert("Recuerda ejecutar la página bajo HTTPS para dar acceso al micrófono.");
      }
    };

    btnStop.onclick = async () => {
      if (animFrame) cancelAnimationFrame(animFrame);
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
      }
      if (audioCtx) {
        await audioCtx.close();
        audioCtx = null;
      }
      btnStart.disabled = false;
      btnStop.disabled = true;
      dot.className = "dot"; // GRIS (Apagado)
      meterFill.style.width = '0%';
    };
  </script>
</body>
</html>
