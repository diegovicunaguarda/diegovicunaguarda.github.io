<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auscultador Profesional V2 - Anti-Golpe</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 450px; margin: 0 auto; text-align: center; }
    .card { background: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    button { background: #2563eb; color: white; border: none; padding: 16px 20px; font-size: 16px; font-weight: bold; border-radius: 12px; margin: 8px 0; cursor: pointer; width: 100%; }
    button:disabled { background: #334155; color: #64748b; }
    .status { font-size: 14px; color: #38bdf8; margin-top: 10px; font-weight: 600; }
    .indicator { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #64748b; margin-right: 6px; }
    .active { background: #22c55e; }
    .suppressed { background: #ef4444; }
    .meter { height: 10px; background: #334155; border-radius: 5px; overflow: hidden; margin-top: 15px; }
    .fill { height: 100%; width: 0%; background: #38bdf8; transition: width 0.05s linear; }
  </style>
</head>
<body>
  <h2>Auscultador V2 Pro</h2>
  <p style="font-size: 13px; color: #94a3b8;">Filtro de pendiente 24dB + Supresor de Golpes de Despegue</p>

  <div class="card">
    <button id="btnStart">Iniciar Auscultación Avanzada</button>
    <button id="btnStop" disabled style="background:#475569;">Detener</button>
    <div style="margin-top:12px; font-size:13px;">
      <span id="dot" class="indicator"></span><span id="txtStatus">Estado: Listo</span>
    </div>
    <div class="meter"><div class="fill" id="meterFill"></div></div>
  </div>

  <script>
    let audioCtx, source, hp1, hp2, lp1, lp2, limiter, gainNode, analyser;
    let animFrame;
    let isMutedForTransient = false;

    document.getElementById('btnStart').onclick = async () => {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });

        source = audioCtx.createMediaStreamSource(stream);

        // 1. Doble Pasa-Altos (24 dB/octava en 105 Hz) para aniquilar el retumbo de manos
        hp1 = audioCtx.createBiquadFilter(); hp1.type = 'highpass'; hp1.frequency.value = 105;
        hp2 = audioCtx.createBiquadFilter(); hp2.type = 'highpass'; hp2.frequency.value = 105;

        // 2. Doble Pasa-Bajos (24 dB/octava en 1100 Hz) para eliminar siseo de fondo
        lp1 = audioCtx.createBiquadFilter(); lp1.type = 'lowpass'; lp1.frequency.value = 1100;
        lp2 = audioCtx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 1100;

        // 3. Limitador de Pared (Brickwall Limiter) - Evita la saturación en oídos
        limiter = audioCtx.createDynamicsCompressor();
        limiter.threshold.value = -12; // Techo estricto en dB
        limiter.knee.value = 0;         // Curva dura instantánea
        limiter.ratio.value = 20;       // Compresión 20:1 (actúa como muro)
        limiter.attack.value = 0.001;   // 1 ms de reacción ultra rápida
        limiter.release.value = 0.04;   // 40 ms de recuperación

        // 4. Ganancia Principal con control de respuesta
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 2.8;

        // 5. Analizador para el Supresor de Transitorios en JS
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256; // Ventana rápida de análisis

        // Cadena: Mic -> HP1 -> HP2 -> LP1 -> LP2 -> Limiter -> Gain -> Audífonos
        source.connect(hp1);
        hp1.connect(hp2);
        hp2.connect(lp1);
        lp1.connect(lp2);
        lp2.connect(limiter);
        limiter.connect(gainNode);
        gainNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        document.getElementById('btnStart').disabled = true;
        document.getElementById('btnStop').disabled = false;
        document.getElementById('txtStatus').textContent = "Escuchando en vivo (Procesando...)";
        document.getElementById('dot').className = "indicator active";

        const pcmData = new Float32Array(analyser.fftSize);

        // Bucle de Detección de Golpes / Despegue de Campana
        function detectTransients() {
          analyser.getFloatTimeDomainData(pcmData);

          let maxPeak = 0;
          let sumSquares = 0;

          for (let i = 0; i < pcmData.length; i++) {
            let abs = Math.abs(pcmData[i]);
            if (abs > maxPeak) maxPeak = abs;
            sumSquares += abs * abs;
          }

          let rms = Math.sqrt(sumSquares / pcmData.length);
          document.getElementById('meterFill').style.width = Math.min(100, rms * 500) + '%';

          // DETECTOR DE IMPACTO: Si el pico supera el umbral crítico (despegue o golpe)
          if (maxPeak > 0.45) {
            // Muteo de emergencia instantáneo (cae a 0.01 en 5 ms)
            gainNode.gain.setTargetAtTime(0.01, audioCtx.currentTime, 0.005);
            document.getElementById('dot').className = "indicator suppressed";
            document.getElementById('txtStatus').textContent = "Impacto / Despegue bloqueado";
            isMutedForTransient = true;
          } else if (isMutedForTransient && maxPeak < 0.2) {
            // Se recupera la ganancia normal cuando se apacigua el ruido (en 80 ms)
            gainNode.gain.setTargetAtTime(2.8, audioCtx.currentTime, 0.08);
            document.getElementById('dot').className = "indicator active";
            document.getElementById('txtStatus').textContent = "Escuchando en vivo";
            isMutedForTransient = false;
          }

          animFrame = requestAnimationFrame(detectTransients);
        }

        detectTransients();

      } catch (err) {
        alert("Recuerda ejecutar la página en HTTPS para permitir el acceso al micrófono.");
      }
    };

    document.getElementById('btnStop').onclick = () => {
      if (audioCtx) audioCtx.close();
      cancelAnimationFrame(animFrame);
      document.getElementById('btnStart').disabled = false;
      document.getElementById('btnStop').disabled = true;
      document.getElementById('txtStatus').textContent = "Estado: Detenido";
      document.getElementById('dot').className = "indicator";
      document.getElementById('meterFill').style.width = '0%';
    };
  </script>
</body>
</html>
