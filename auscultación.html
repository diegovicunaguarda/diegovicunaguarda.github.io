<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auscultador Inteligente Auto-DSP</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 450px; margin: 0 auto; text-align: center; }
    .card { background: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    button { background: #3b82f6; color: white; border: none; padding: 16px 20px; font-size: 16px; font-weight: bold; border-radius: 12px; margin: 8px 0; cursor: pointer; width: 100%; transition: all 0.2s; }
    button:disabled { background: #334155; color: #94a3b8; }
    .status { font-size: 14px; color: #38bdf8; margin-top: 10px; font-weight: 600; }
    .meter { height: 10px; background: #334155; border-radius: 5px; overflow: hidden; margin-top: 15px; }
    .fill { height: 100%; width: 0%; background: #34d399; transition: width 0.1s ease; }
  </style>
</head>
<body>
  <h2>Auscultador Inteligente</h2>
  <p style="font-size: 13px; color: #94a3b8;">Filtro adaptativo y ganancia automática activa</p>

  <div class="card">
    <button id="btnStart">Iniciar Auscultación Automática</button>
    <button id="btnStop" disabled style="background:#475569;">Detener</button>
    <div class="status" id="txtStatus">Estado: Listo</div>
    <div class="meter"><div class="fill" id="meterFill"></div></div>
  </div>

  <script>
    let audioCtx, source, highPass, lowPass, compressor, gainNode, analyser;
    let animFrame;

    document.getElementById('btnStart').onclick = async () => {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });

        source = audioCtx.createMediaStreamSource(stream);

        // 1. Filtro Pasa-Altos fijo (elimina roce y graves pesados)
        highPass = audioCtx.createBiquadFilter();
        highPass.type = 'highpass';
        highPass.frequency.value = 85; 

        // 2. Filtro Pasa-Bajos fijo (elimina estática de alta frecuencia)
        lowPass = audioCtx.createBiquadFilter();
        lowPass.type = 'lowpass';
        lowPass.frequency.value = 1100; 

        // 3. Compresor de Dinámica Automático (Atena golpes de fricción)
        compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.value = -24; // Empieza a comprimir sonidos muy fuertes
        compressor.knee.value = 12;
        compressor.ratio.value = 8;        // Reduce picos fuertes 8:1
        compressor.attack.value = 0.003;   // Reacción ultra rápida (3 ms)
        compressor.release.value = 0.25;

        // 4. Control de Ganancia Inteligente (AGC)
        gainNode = audioCtx.createGain();
        gainNode.gain.value = 3.0; // Ganancia base inicial

        // 5. Analizador de espectro para el bucle de auto-ajuste
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;

        // Cadena: Micrófono -> Pasa-Altos -> Pasa-Bajos -> Compresor -> Ganancia AGC -> Analizador -> Audífonos
        source.connect(highPass);
        highPass.connect(lowPass);
        lowPass.connect(compressor);
        compressor.connect(gainNode);
        gainNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        document.getElementById('btnStart').disabled = true;
        document.getElementById('btnStop').disabled = false;
        document.getElementById('txtStatus').textContent = "Procesando audio en tiempo real...";

        // Bucle de Autorregulación de Ganancia (AGC)
        const pcmData = new Float32Array(analyser.fftSize);
        function autoAdjust() {
          analyser.getFloatTimeDomainData(pcmData);
          
          // Calcular valor RMS (volumen real de la señal)
          let sum = 0;
          for (let i = 0; i < pcmData.length; i++) {
            sum += pcmData[i] * pcmData[i];
          }
          let rms = Math.sqrt(sum / pcmData.length);
          
          // Actualizar barra visual
          document.getElementById('meterFill').style.width = Math.min(100, rms * 400) + '%';

          // Lógica AGC: Si el audio es muy débil, auto-amplifica suavemente; si es muy fuerte, atenúa.
          if (rms < 0.03 && rms > 0.005) {
            gainNode.gain.setTargetAtTime(4.5, audioCtx.currentTime, 0.1); // Subir volumen a ruidos suaves
          } else if (rms >= 0.03 && rms < 0.15) {
            gainNode.gain.setTargetAtTime(2.5, audioCtx.currentTime, 0.1); // Volumen normal respiratorio
          } else if (rms >= 0.15) {
            gainNode.gain.setTargetAtTime(0.8, audioCtx.currentTime, 0.05); // Atenuar impactos o tos
          }

          animFrame = requestAnimationFrame(autoAdjust);
        }
        autoAdjust();

      } catch (err) {
        alert("Asegúrate de ejecutar la página en un entorno HTTPS seguro para dar acceso al micrófono.");
      }
    };

    document.getElementById('btnStop').onclick = () => {
      if (audioCtx) audioCtx.close();
      cancelAnimationFrame(animFrame);
      document.getElementById('btnStart').disabled = false;
      document.getElementById('btnStop').disabled = true;
      document.getElementById('txtStatus').textContent = "Estado: Detenido";
      document.getElementById('meterFill').style.width = '0%';
    };
  </script>
</body>
</html>
